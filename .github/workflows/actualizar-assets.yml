name: Actualizar assets del perfil

# Regenera los SVG (radares, stats y barra de lenguajes) todos los días
# con los datos reales de la cuenta, y publica los cambios si existen.
on:
  schedule:
    - cron: "0 6 * * *"   # todos los días a las 06:00 UTC
  workflow_dispatch:       # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write          # necesario para hacer commit de los assets

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar los assets
        run: python generar_assets.py

      - name: Publicar cambios si existen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Sin cambios en los assets."
          else
            git commit -m "Actualizar assets del perfil"
            git push
          fi
